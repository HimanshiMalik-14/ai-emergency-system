<!DOCTYPE html>
<html>
<head>
  <title>Accident Hotspots</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Accident Hotspots</h2>
  <canvas id="hotspotChart"></canvas>
  <script>
    const ctx = document.getElementById('hotspotChart');
    const hotspotChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Ghaziabad', 'Delhi'],
        datasets: [{
          label: 'Accidents',
          data: [12, 8],
          backgroundColor: ['#ff6384', '#36a2eb']
        }]
      }
    });
  </script>
</body>
</html>
