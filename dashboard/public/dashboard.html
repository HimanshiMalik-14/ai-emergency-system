<!DOCTYPE html>
<html>
<head>
  <title>Emergency Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    #map { height: 400px; }
    #chart { width: 600px; height: 300px; }
  </style>
</head>
<body>
  <h1>Accident Hotspots Dashboard</h1>
  <div id="map"></div>
  <canvas id="chart"></canvas>

  <script>
    // Fetch hotspots
    fetch('/api/hotspots')
      .then(res => res.json())
      .then(data => {
        // Leaflet map
        const map = L.map('map').setView([28.6692, 77.4538], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        Object.entries(data).forEach(([coords, count]) => {
          const [lat, lon] = coords.split(',').map(Number);
          L.marker([lat, lon]).addTo(map)
            .bindPopup(`Accidents: ${count}`);
        });

        // Chart.js
        const ctx = document.getElementById('chart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: Object.keys(data),
            datasets: [{
              label: 'Accident Count',
              data: Object.values(data),
              backgroundColor: 'rgba(255, 99, 132, 0.6)'
            }]
          }
        });
      });
  </script>
</body>
</html>
